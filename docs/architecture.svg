      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 11px; }
      .tiny { font-size: 10px; }
      .box { stroke-width: 2; rx: 6; }
      .edge { fill: none; stroke-width: 2; }
      .dash { stroke-dasharray: 7 5; }
    </style>
